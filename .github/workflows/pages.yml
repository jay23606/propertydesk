name: Deploy PropertyDesk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.config.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Create empty browser config for candidate smoke check
        run: printf '%s\n' 'window.PROPERTYDESK_CONFIG = {};' > config.js
      - name: Serve candidate files for browser smoke check
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/propertydesk-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null
      - name: Check candidate account-detail workflow in Chromium
        run: npm run smoke:deployed -- http://127.0.0.1:4173/
      - name: Check deployment configuration
        id: config
        env:
          PROPERTYDESK_SUPABASE_URL: ${{ secrets.PROPERTYDESK_SUPABASE_URL }}
          PROPERTYDESK_SUPABASE_ANON_KEY: ${{ secrets.PROPERTYDESK_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$PROPERTYDESK_SUPABASE_URL" ] && [ -n "$PROPERTYDESK_SUPABASE_ANON_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Tests passed. Pages deployment is skipped until both Supabase repository secrets are configured.'
          fi

  deploy:
    needs: verify
    if: needs.verify.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate untracked browser config
        env:
          PROPERTYDESK_SUPABASE_URL: ${{ secrets.PROPERTYDESK_SUPABASE_URL }}
          PROPERTYDESK_SUPABASE_ANON_KEY: ${{ secrets.PROPERTYDESK_SUPABASE_ANON_KEY }}
        run: |
          node -e 'const fs=require("fs"); const config={supabaseUrl:process.env.PROPERTYDESK_SUPABASE_URL,supabaseAnonKey:process.env.PROPERTYDESK_SUPABASE_ANON_KEY}; fs.writeFileSync("config.js", `window.PROPERTYDESK_CONFIG = ${JSON.stringify(config)};\n`);'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  runtime-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the deployed app in Chromium
        run: npm run smoke:deployed -- "${{ needs.deploy.outputs.page_url }}"
